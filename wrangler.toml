name = "kardivo"
main = "worker.js"
compatibility_date = "2026-10-08"

# ...
[[d1_databases]]
binding = "DB"
database_id = "3c955451-b6fe-459e-95dd-b90bad198625"
# ...
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Everything goes through the Worker (so /sitemap.xml, /robots.txt, /media/* and product
# link-preview tags work) except the plain static files, which are served directly.
run_worker_first = ["/*", "!/styles.css", "!/app.js", "!/manifest.webmanifest", "!/sw.js", "!/offline.html", "!/icons/*"]

# Discord new-order alerts. This id is who gets pinged. The webhook URL is a SECRET, set it with:
#   wrangler secret put DISCORD_WEBHOOK_URL
[vars]
DISCORD_USER_ID = "797626962494488636"
# Sender for customer emails (password reset, delivery). Must be on a domain verified in Resend/Mailgun.
# EMAIL_FROM = "Kardivo <orders@yourdomain.com>"
# Contact address shown to push services (mailto: or https: URL).
# VAPID_SUBJECT = "mailto:you@yourdomain.com"
# Optional: public site URL used in emails when it can't be detected.
# PUBLIC_ORIGIN = "https://yourdomain.com"

# Scheduled jobs: hourly. Releases expired reservations and checks low stock every hour,
# and runs the daily database backup to R2 at 03:00 UTC.
[triggers]
crons = ["0 * * * *"]

# Secrets (set with `wrangler secret put NAME`, never in this file):
#   RESEND_API_KEY                      email via Resend   (or use the Mailgun trio below)
#   MAILGUN_API_KEY, MAILGUN_DOMAIN, MAILGUN_REGION (eu or empty)
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY admin push notifications (node scripts/generate-vapid.mjs)
#   DISCORD_WEBHOOK_URL                 as before

# Backups and uploads need an R2 bucket. If you already have one bound (R2, MEDIA, PAYMENT_PROOFS
# or PRODUCT_ASSETS) keep it as it is. Otherwise:
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "kardivo-files"

# KEEP YOUR EXISTING D1 BINDING. If your current wrangler.toml has a [[d1_databases]]
# block, copy it here exactly as it is (binding must be "DB"). Example:
# [[d1_databases]]
# binding = "DB"
# database_name = "your-db-name"
# database_id = "your-existing-database-id"
